name: Deploy to GitHub Pages

# Builds an optimized copy of the site (WebP photos, compacted JSON) and deploys it.
# The files in the repo are never modified; see .github/scripts/build-site.sh.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install cwebp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq webp

      - name: Build optimized site
        run: .github/scripts/build-site.sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
